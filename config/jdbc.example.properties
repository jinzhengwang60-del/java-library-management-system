# Set BOOKSYS_CONFIG to the absolute path of a private copy outside the deployed WAR.
# BOOKSYS_DB_URL / BOOKSYS_DB_USER / BOOKSYS_DB_PASSWORD take precedence.
jdbc.url=jdbc:mysql://127.0.0.1:3306/booksys?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
jdbc.username=booksys_app
jdbc.password=YOUR_LOCAL_PASSWORD


# Optional image storage outside the deployed WAR. Windows paths use forward slashes.
# BOOKSYS_UPLOAD_DIR takes precedence.
# upload.directory=C:/booksys-data/uploads

# Optional Base64-encoded random signing key (at least 32 decoded bytes).
# BOOKSYS_REMEMBER_KEY takes precedence.
# Leave unset to generate a fresh key on every restart.
# remember.key=
